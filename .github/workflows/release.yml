name: Release

# Push a tag like v1.0 (or start it by hand from the Actions tab) to publish a signed APK
# on the Releases page. Needs the KEYSTORE_BASE64, KS_PASS and KS_ALIAS repository secrets,
# so every release is signed with the same key and installs as an update over the previous one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apksigner dalvik-exchange android-sdk-platform-23 zipalign

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret (Settings > Secrets and variables > Actions)."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        env:
          KEYSTORE: ${{ runner.temp }}/release.keystore
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          node test/calc.test.js
          ./build.sh
          mkdir -p dist && cp "build/Tope.apk" "dist/Tope-$TAG.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Tope $TAG" --generate-notes
          gh release upload "$TAG" "dist/Tope-$TAG.apk" --clobber
