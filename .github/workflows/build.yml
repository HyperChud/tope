name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apksigner dalvik-exchange android-sdk-platform-23 zipalign

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run calculation tests
        run: node test/calc.test.js

      # Optional: to get APKs that install as updates over each other, add your keystore as
      # repository secrets (Settings > Secrets and variables > Actions):
      #   KEYSTORE_BASE64 = base64 of the .keystore file, KS_PASS = its password, KS_ALIAS = key alias.
      # Without them, each run signs with a throwaway key.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"; fi

      - name: Build
        env:
          KEYSTORE: ${{ runner.temp }}/release.keystore
          KS_PASS: ${{ secrets.KS_PASS || 'topetope' }}
          KS_ALIAS: ${{ secrets.KS_ALIAS || 'tope' }}
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Tope
          path: build/Tope.apk
