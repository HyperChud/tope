<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: blob: file:; connect-src 'none'">
<title>Topé</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bd" aria-hidden="true"><div class="bimg"></div><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>

<div class="book"><main id="main"></main></div>

  <button data-tab="cal"><span class="pill" data-icon="cal"></span><span class="nt">Calendrier</span></button>
  <button data-tab="graph"><span class="pill" data-icon="chart"></span><span class="nt">Graphiques</span></button>
  <button data-tab="set"><span class="pill" data-icon="tune"></span><span class="nt">Réglages</span></button>
</nav>

<div class="scrim" id="scrim"></div>

<script src="subs.js"></script>
